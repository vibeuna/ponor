<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Inter, system-ui, -apple-system, sans-serif" id="prompt-svg" role="img" aria-labelledby="prompt-title prompt-desc">
  <title id="prompt-title">Isti zahtjev, dva prompta: šablon ili email spreman za slanje</title>
  <desc id="prompt-desc">Lijevo: kratak prompt "Napiši mi email šefu da sutra ne mogu doći." ChatGPT je vratio opšti šablon s prazninom za ime, bez razloga. Desno: detaljan prompt s četiri dijela (zadatak i za koga, šta treba znati, šta predložiti, oblik). ChatGPT je vratio email od 42 riječi s imenom šefice, razlogom i oba prijedloga. Odgovori su doslovni, iz našeg testa 11. oktobra 2026.</desc>

  <defs>
    <marker id="prompt-ah-stone" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#78716C"/>
    </marker>
    <marker id="prompt-ah-coffee" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#B45309"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="#FAF9F6"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="Merriweather, Georgia, serif" font-size="20" font-weight="700" fill="#1C1917">Isti zahtjev, dva prompta</text>
  <text x="450" y="64" text-anchor="middle" font-size="13" fill="#78716C">Model zna samo ono što mu napišete</text>

  <!-- ============ LEFT: short prompt (baseline, neutral) ============ -->
  <g class="rv" opacity="0">
    <animate attributeName="opacity" from="0" to="1" values="0;1" keyTimes="0;1" begin="0.2s" dur="0.4s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <text x="60" y="100" font-size="11" font-weight="700" fill="#78716C" letter-spacing="0.8">KRATAK PROMPT</text>
    <rect x="60" y="112" width="360" height="238" rx="8" fill="#F5F5F0" stroke="#E7E5E4" stroke-width="1.5"/>
    <rect x="60" y="112" width="3" height="238" fill="#78716C"/>
    <text x="80" y="146" font-size="14" fill="#1C1917" font-style="italic" font-family="Merriweather, Georgia, serif">"Napiši mi email šefu da</text>
    <text x="80" y="166" font-size="14" fill="#1C1917" font-style="italic" font-family="Merriweather, Georgia, serif">sutra ne mogu doći."</text>
    <text x="80" y="318" font-size="11" fill="#78716C" font-style="italic">nema imena, razloga, tona ni dužine:</text>
    <text x="80" y="334" font-size="11" fill="#78716C" font-style="italic">model mora pogađati</text>
  </g>

  <g class="rv" opacity="0">
    <animate attributeName="opacity" from="0" to="1" values="0;1" keyTimes="0;1" begin="0.7s" dur="0.3s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <line x1="240" y1="358" x2="240" y2="378" stroke="#78716C" stroke-width="1.5" marker-end="url(#prompt-ah-stone)"/>
  </g>

  <g class="rv" opacity="0">
    <animate attributeName="opacity" from="0" to="1" values="0;1" keyTimes="0;1" begin="0.9s" dur="0.4s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <rect x="60" y="388" width="360" height="160" rx="8" fill="#F5F5F0" stroke="#E7E5E4" stroke-width="1.5"/>
    <rect x="60" y="388" width="3" height="160" fill="#78716C"/>
    <text x="80" y="410" font-size="11" font-weight="700" fill="#78716C" letter-spacing="0.8">ODGOVOR</text>
    <rect x="296" y="396" width="112" height="22" rx="11" fill="#F5F5F0" stroke="#A8A29E" stroke-width="1"/>
    <text x="352" y="411" text-anchor="middle" font-size="11" font-weight="600" fill="#57534E">opšti šablon</text>
    <g font-size="12" fill="#44403C" font-style="italic" font-family="Merriweather, Georgia, serif">
      <text x="80" y="434">Poštovani,</text>
      <text x="80" y="454">ovim putem Vas želim obavijestiti da sutra,</text>
      <text x="80" y="472">nažalost, neću biti u mogućnosti doći na posao.</text>
      <text x="80" y="492">Hvala na razumijevanju.</text>
      <text x="80" y="512">Srdačan pozdrav,</text>
    </g>
    <rect x="76" y="518" width="86" height="20" rx="4" fill="none" stroke="#A8A29E" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="82" y="532" font-size="12" fill="#57534E" font-style="italic" font-family="Merriweather, Georgia, serif">[Vaše ime]</text>
  </g>

  <!-- ============ RIGHT: detailed prompt (focal, coffee) ============ -->
  <g class="rv" opacity="0">
    <animate attributeName="opacity" from="0" to="1" values="0;1" keyTimes="0;1" begin="1.5s" dur="0.4s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <text x="480" y="100" font-size="11" font-weight="700" fill="#B45309" letter-spacing="0.8">DETALJAN PROMPT</text>
    <rect x="480" y="112" width="360" height="238" rx="8" fill="#FDF6EC" stroke="#B45309" stroke-width="2"/>
    <rect x="480" y="112" width="3" height="238" fill="#B45309"/>
  </g>

  <g font-size="13" fill="#1C1917" font-style="italic" font-family="Merriweather, Georgia, serif">
    <g class="rv" opacity="0">
      <animate attributeName="opacity" from="0" to="1" values="0;1" keyTimes="0;1" begin="1.8s" dur="0.3s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      <text x="500" y="136" font-family="Inter, system-ui, -apple-system, sans-serif" font-style="normal" font-size="10" font-weight="700" fill="#92400E" letter-spacing="0.8">ZADATAK I ZA KOGA</text>
      <text x="500" y="154">Napiši kratak email šefici, gospođi Hadžić.</text>
    </g>
    <g class="rv" opacity="0">
      <animate attributeName="opacity" from="0" to="1" values="0;1" keyTimes="0;1" begin="2.0s" dur="0.3s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      <text x="500" y="180" font-family="Inter, system-ui, -apple-system, sans-serif" font-style="normal" font-size="10" font-weight="700" fill="#92400E" letter-spacing="0.8">ŠTA TREBA ZNATI</text>
      <text x="500" y="198">Sutra (utorak) ne mogu doći na posao</text>
      <text x="500" y="215">jer mi dijete ima temperaturu.</text>
    </g>
    <g class="rv" opacity="0">
      <animate attributeName="opacity" from="0" to="1" values="0;1" keyTimes="0;1" begin="2.2s" dur="0.3s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      <text x="500" y="241" font-family="Inter, system-ui, -apple-system, sans-serif" font-style="normal" font-size="10" font-weight="700" fill="#92400E" letter-spacing="0.8">ŠTA PREDLOŽITI</text>
      <text x="500" y="259">Ponudi da popodne radim od kuće i da</text>
      <text x="500" y="276">sastanak u 10 sati prebacimo na srijedu.</text>
    </g>
    <g class="rv" opacity="0">
      <animate attributeName="opacity" from="0" to="1" values="0;1" keyTimes="0;1" begin="2.4s" dur="0.3s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      <text x="500" y="302" font-family="Inter, system-ui, -apple-system, sans-serif" font-style="normal" font-size="10" font-weight="700" fill="#92400E" letter-spacing="0.8">OBLIK</text>
      <text x="500" y="320">Ton: profesionalan, ali ne ukočen.</text>
      <text x="500" y="337">Najviše 80 riječi.</text>
    </g>
  </g>

  <g class="rv" opacity="0">
    <animate attributeName="opacity" from="0" to="1" values="0;1" keyTimes="0;1" begin="2.7s" dur="0.3s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <line x1="660" y1="358" x2="660" y2="378" stroke="#B45309" stroke-width="2" marker-end="url(#prompt-ah-coffee)"/>
  </g>

  <g class="rv rv-rise" opacity="0" transform="translate(0, 8)">
    <animate attributeName="opacity" from="0" to="1" values="0;1" keyTimes="0;1" begin="2.9s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" values="0 8;0 0" keyTimes="0;1" begin="2.9s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <rect x="480" y="388" width="360" height="160" rx="8" fill="#FDF6EC" stroke="#B45309" stroke-width="1"/>
    <rect x="480" y="388" width="3" height="160" fill="#B45309"/>
    <text x="500" y="410" font-size="11" font-weight="700" fill="#B45309" letter-spacing="0.8">ODGOVOR</text>
    <rect x="652" y="396" width="176" height="22" rx="11" fill="#FDF6EC" stroke="#B45309" stroke-width="1"/>
    <text x="740" y="411" text-anchor="middle" font-size="11" font-weight="600" fill="#92400E">42 riječi, spremno za slanje</text>
    <g font-size="12" fill="#1C1917" font-style="italic" font-family="Merriweather, Georgia, serif">
      <text x="500" y="434">Poštovana gospođo Hadžić,</text>
      <text x="500" y="454">sutra, u utorak, neću moći doći na posao jer mi</text>
      <text x="500" y="472">dijete ima temperaturu. Ako Vam odgovara, mogu</text>
      <text x="500" y="490">popodne raditi od kuće. Također bih predložila da</text>
      <text x="500" y="508">sastanak zakazan za 10 sati pomjerimo na srijedu.</text>
      <text x="500" y="528">Hvala Vam na razumijevanju. Srdačan pozdrav</text>
    </g>
  </g>

  <!-- Footnote -->
  <g class="rv" opacity="0">
    <animate attributeName="opacity" from="0" to="1" values="0;1" keyTimes="0;1" begin="3.5s" dur="0.4s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <text x="60" y="578" font-size="11" fill="#78716C" font-style="italic">Doslovni odgovori ChatGPT-a (GPT-6, besplatan nalog), naš test 11. oktobra 2026, jedan pokušaj po promptu.</text>
  </g>

  <!-- Replay button -->
  <g class="replay-btn" style="cursor:pointer; opacity:0; transition: opacity 0.2s ease;" role="button" tabindex="0" aria-label="Pusti animaciju ponovo">
    <circle cx="855" cy="40" r="16" fill="#F5F5F0" stroke="#E7E5E4" stroke-width="1"/>
    <path d="M 855 31 A 9 9 0 1 1 846 40" fill="none" stroke="#78716C" stroke-width="1.5" stroke-linecap="round"/>
    <polygon points="852,28 858,28 855,33" fill="#78716C"/>
    <title>Pusti ponovo</title>
  </g>

  <style>
    #prompt-svg:hover .replay-btn { opacity: 1 !important; }
    #prompt-svg .replay-btn:hover circle { fill: #FDF6EC; stroke: #B45309; }
    #prompt-svg .replay-btn:hover path { stroke: #B45309; }
    #prompt-svg .replay-btn:hover polygon { fill: #B45309; }
    #prompt-svg .replay-btn:focus { outline: none; opacity: 1 !important; }
    #prompt-svg .replay-btn:focus circle { stroke: #B45309; stroke-width: 2; }
    @media (prefers-reduced-motion: reduce) {
      #prompt-svg animate, #prompt-svg animateTransform { display: none; }
      #prompt-svg .replay-btn { display: none; }
      /* display:none does not reliably stop SMIL, and the groups start at
         opacity 0; force the final state so nothing stays invisible. */
      #prompt-svg .rv { opacity: 1 !important; }
      #prompt-svg .rv-rise { transform: none !important; }
    }
  </style>

  <script>
    // <![CDATA[
    (function () {
      const svg = document.getElementById('prompt-svg');
      const btn = svg && svg.querySelector('.replay-btn');
      if (!svg || !btn) return;
      function replay() { if (typeof svg.setCurrentTime === 'function') svg.setCurrentTime(0); }
      btn.addEventListener('click', replay);
      btn.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); replay(); }
      });
    })();
    // ]]>
  </script>
</svg>
