<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" font-family="Inter, system-ui, -apple-system, sans-serif" id="html-stranica-svg" role="img" aria-labelledby="html-stranica-svg-title html-stranica-svg-desc">
<title id="html-stranica-svg-title">Kako vještina pravi stranicu</title>
<desc id="html-stranica-svg-desc">Korisnik pita: Objasni html stranicom, šta je biljna ćelija? Vještina prolazi četiri koraka. Prvi, plan: jedan mehanizam, jedna do tri kontrole, izbor obrasca. Drugi, izrada: jedan HTML fajl s CSS-om i JavaScriptom unutra, svijetli i tamni način. Treći, sadržaj: naslov i opis, jedinice uz kontrole, linija Probaj ovo i lista pojednostavljenja. Četvrti, tačnost: stvarne konstante, zaokruženi brojevi, navedena odstupanja. Izlaz: jedna HTML stranica s kontrolama. Ograničenje od jedne do tri kontrole je orijentir autora vještine, ne izvor.</desc>
