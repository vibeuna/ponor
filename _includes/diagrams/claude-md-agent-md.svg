<title id="cmam-svg-title">Koje fajlove s uputama Claude Code čita</title>
<desc id="cmam-svg-desc">Četiri situacije, po zadanoj postavci. Ako repozitorij ima samo AGENTS.md, Claude Code čita AGENTS.md. Ako ima i CLAUDE.md i AGENTS.md, čita samo CLAUDE.md. Ako CLAUDE.md uvozi AGENTS.md redom @AGENTS.md, čita oba. Zamka: ako se u projekat sa samo AGENTS.md doda CLAUDE.local.md, Claude Code čita CLAUDE.local.md, a AGENTS.md prestaje čitati. Oba fajla se čitaju uz uvoz @AGENTS.md ili uz postavku claude-md-and-agents-md.</desc>
