<style>
#cmam-svg:hover .replay-btn { opacity: 1; }
#cmam-svg .replay-btn:hover circle { fill: #FDF6EC; stroke: #B45309; }
#cmam-svg .replay-btn:hover path { stroke: #B45309; }
#cmam-svg .replay-btn:hover polygon { fill: #B45309; }
#cmam-svg .replay-btn:focus { outline: none; opacity: 1; }
#cmam-svg .replay-btn:focus circle { stroke: #B45309; stroke-width: 2; }
@media (prefers-reduced-motion: reduce) {
  #cmam-svg animate, #cmam-svg animateTransform { display: none; }
  #cmam-svg .replay-btn { display: none; }
}
</style>
<script>
// <![CDATA[
(function () {
  const svg = document.getElementById('cmam-svg');
  const btn = svg && svg.querySelector('.replay-btn');
  if (!svg || !btn) return;
  // Reduced motion: stop the timeline at its end so the final state shows even if SMIL keeps running.
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches && svg.pauseAnimations) {
    svg.pauseAnimations(); svg.setCurrentTime(10); return;
  }
  function replay() { if (typeof svg.setCurrentTime === 'function') svg.setCurrentTime(0); }
  btn.addEventListener('click', replay);
  btn.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); replay(); }
  });
})();
// ]]>
</script>
</svg>
