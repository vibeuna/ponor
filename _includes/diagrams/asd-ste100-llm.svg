<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Inter, system-ui, -apple-system, sans-serif" id="ste-svg" role="img" aria-labelledby="ste-svg-title ste-svg-desc">
<title id="ste-svg-title">Ista uputa prije i poslije pravila STE-a</title>
<desc id="ste-svg-desc">Prije: jedna rečenica od 19 riječi, "The cover should be removed after ensuring that the power has been disconnected, if the warning light is on." Poslije, u stilu STE-a: "If the warning light is on: 1. Disconnect the power. 2. Remove the cover." Primijenjena pravila: 1 uslov na početku, 2 imperativ, 3 bez pasiva, 4 jedna radnja po koraku, 5 bez oblika na -ing. Primjer u stilu STE-a, nije provjeren prema standardu.</desc>
<defs>
<marker id="ste-svg-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker>
</defs>
<rect width="900" height="560" fill="#FAF9F6"/>
<text x="450" y="42" text-anchor="middle" font-family="Merriweather, Georgia, serif" font-size="20" font-weight="700" fill="#1C1917">Ista uputa, dva načina pisanja</text>
<text x="450" y="66" text-anchor="middle" font-size="13" fill="#78716C">Jedan korak održavanja, prije i poslije pravila STE-a</text>

<g><animate attributeName="opacity" values="0;0;1" dur="0.70s" keyTimes="0;0.429;1" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1"/>
<rect x="60" y="100" width="360" height="200" rx="8" fill="#F5F5F0" stroke="#E7E5E4" stroke-width="1.5"/>
<rect x="60" y="100" width="3" height="200" fill="#78716C"/>
<text x="84" y="126" font-size="11" font-weight="700" letter-spacing="0.8" fill="#78716C">PRIJE</text>
<text x="84" y="160" font-family="Merriweather, Georgia, serif" font-size="15" font-style="italic" fill="#1C1917">The cover <tspan style="text-decoration: underline; text-decoration-color: #A8A29E;">should be removed</tspan><tspan dy="-6" font-family="Inter, system-ui, sans-serif" font-style="normal" font-size="10" font-weight="700" fill="#78716C">3</tspan><tspan dy="6"> </tspan></text>
<text x="84" y="188" font-family="Merriweather, Georgia, serif" font-size="15" font-style="italic" fill="#1C1917">after <tspan style="text-decoration: underline; text-decoration-color: #A8A29E;">ensuring</tspan><tspan dy="-6" font-family="Inter, system-ui, sans-serif" font-style="normal" font-size="10" font-weight="700" fill="#78716C">5</tspan><tspan dy="6"> </tspan>that the power</text>
<text x="84" y="216" font-family="Merriweather, Georgia, serif" font-size="15" font-style="italic" fill="#1C1917"><tspan style="text-decoration: underline; text-decoration-color: #A8A29E;">has been disconnected</tspan>,<tspan dy="-6" font-family="Inter, system-ui, sans-serif" font-style="normal" font-size="10" font-weight="700" fill="#78716C">3</tspan><tspan dy="6"> </tspan></text>
<text x="84" y="244" font-family="Merriweather, Georgia, serif" font-size="15" font-style="italic" fill="#1C1917"><tspan style="text-decoration: underline; text-decoration-color: #A8A29E;">if the warning light is on</tspan>.<tspan dy="-6" font-family="Inter, system-ui, sans-serif" font-style="normal" font-size="10" font-weight="700" fill="#78716C">1</tspan><tspan dy="6"> </tspan></text>
<rect x="84" y="258" width="150" height="28" rx="14" fill="#F5F5F0" stroke="#A8A29E" stroke-width="1"/>
<text x="159" y="277" text-anchor="middle" font-size="13" font-weight="600" fill="#44403C">1 rečenica, 19 riječi</text>
</g>

<line x1="430" y1="200" x2="468" y2="200" stroke="#B45309" stroke-width="2" marker-end="url(#ste-svg-arrow)"><animate attributeName="opacity" values="0;0;1" dur="1.30s" keyTimes="0;0.769;1" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1"/></line>

<g><animate attributeName="opacity" values="0;0;1" dur="1.70s" keyTimes="0;0.765;1" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" dur="1.80s" keyTimes="0;0.722;1" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1"/>
<rect x="480" y="100" width="360" height="200" rx="8" fill="#FDF6EC" stroke="#B45309" stroke-width="2"/>
<rect x="480" y="100" width="3" height="200" fill="#B45309"/>
<text x="504" y="126" font-size="11" font-weight="700" letter-spacing="0.8" fill="#B45309">POSLIJE (STE)</text>
<rect x="504" y="258" width="170" height="28" rx="14" fill="#FDF6EC" stroke="#B45309" stroke-width="1"/>
<text x="589" y="277" text-anchor="middle" font-size="13" font-weight="600" fill="#92400E">uslov + 2 koraka, 12 riječi</text>
</g>
<text x="504" y="160" font-family="Merriweather, Georgia, serif" font-size="15" font-style="italic" fill="#1C1917"><animate attributeName="opacity" values="0;0;1" dur="2.00s" keyTimes="0;0.800;1" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1"/><tspan font-weight="700" fill="#92400E">If the warning light is on:</tspan><tspan dy="-6" font-family="Inter, system-ui, sans-serif" font-style="normal" font-size="10" font-weight="700" fill="#92400E">1</tspan><tspan dy="6"> </tspan></text>
<text x="504" y="196" font-family="Merriweather, Georgia, serif" font-size="15" font-style="italic" fill="#1C1917"><animate attributeName="opacity" values="0;0;1" dur="2.20s" keyTimes="0;0.818;1" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1"/>1. <tspan font-weight="700" fill="#92400E">Disconnect</tspan><tspan dy="-6" font-family="Inter, system-ui, sans-serif" font-style="normal" font-size="10" font-weight="700" fill="#92400E">2</tspan><tspan dy="6"> </tspan>the power.<tspan dy="-6" font-family="Inter, system-ui, sans-serif" font-style="normal" font-size="10" font-weight="700" fill="#92400E">4</tspan><tspan dy="6"> </tspan></text>
<text x="504" y="224" font-family="Merriweather, Georgia, serif" font-size="15" font-style="italic" fill="#1C1917"><animate attributeName="opacity" values="0;0;1" dur="2.40s" keyTimes="0;0.833;1" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1"/>2. <tspan font-weight="700" fill="#92400E">Remove</tspan><tspan dy="-6" font-family="Inter, system-ui, sans-serif" font-style="normal" font-size="10" font-weight="700" fill="#92400E">2</tspan><tspan dy="6"> </tspan>the cover.<tspan dy="-6" font-family="Inter, system-ui, sans-serif" font-style="normal" font-size="10" font-weight="700" fill="#92400E">4</tspan><tspan dy="6"> </tspan></text>

<g><animate attributeName="opacity" values="0;0;1" dur="2.90s" keyTimes="0;0.862;1" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" dur="3.00s" keyTimes="0;0.833;1" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1"/>
<rect x="60" y="330" width="780" height="164" rx="8" fill="#F5F5F0" stroke="#E7E5E4" stroke-width="1.5"/>
<rect x="84" y="350" width="3" height="14" fill="#B45309"/>
<text x="96" y="362" font-family="Merriweather, Georgia, serif" font-size="13" font-weight="700" fill="#1C1917">Pravila iz primjera (brojevi uz tekst iznad)</text>
</g>
<g><animate attributeName="opacity" values="0;0;1" dur="3.15s" keyTimes="0;0.873;1" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1"/><circle cx="93" cy="394" r="10" fill="#F5F5F0" stroke="#A8A29E" stroke-width="1"/><text x="93" y="398" text-anchor="middle" font-size="11" font-weight="700" fill="#44403C">1</text><text x="112" y="398" font-size="13" font-weight="700" fill="#1C1917">Uslov na početku<tspan dx="8" font-weight="400" fill="#57534E">Čitalac prvo zna kada.</tspan></text></g>
<g><animate attributeName="opacity" values="0;0;1" dur="3.30s" keyTimes="0;0.879;1" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1"/><circle cx="93" cy="426" r="10" fill="#F5F5F0" stroke="#A8A29E" stroke-width="1"/><text x="93" y="430" text-anchor="middle" font-size="11" font-weight="700" fill="#44403C">2</text><text x="112" y="430" font-size="13" font-weight="700" fill="#1C1917">Imperativ<tspan dx="8" font-weight="400" fill="#57534E">Radnja je prva riječ koraka.</tspan></text></g>
<g><animate attributeName="opacity" values="0;0;1" dur="3.45s" keyTimes="0;0.884;1" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1"/><circle cx="93" cy="458" r="10" fill="#F5F5F0" stroke="#A8A29E" stroke-width="1"/><text x="93" y="462" text-anchor="middle" font-size="11" font-weight="700" fill="#44403C">3</text><text x="112" y="462" font-size="13" font-weight="700" fill="#1C1917">Bez pasiva<tspan dx="8" font-weight="400" fill="#57534E">Jasno je ko radi šta.</tspan></text></g>
<g><animate attributeName="opacity" values="0;0;1" dur="3.60s" keyTimes="0;0.889;1" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1"/><circle cx="493" cy="394" r="10" fill="#F5F5F0" stroke="#A8A29E" stroke-width="1"/><text x="493" y="398" text-anchor="middle" font-size="11" font-weight="700" fill="#44403C">4</text><text x="512" y="398" font-size="13" font-weight="700" fill="#1C1917">Jedna radnja po koraku<tspan dx="8" font-weight="400" fill="#57534E">Dvije radnje, dva koraka.</tspan></text></g>
<g><animate attributeName="opacity" values="0;0;1" dur="3.75s" keyTimes="0;0.893;1" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1"/><circle cx="493" cy="426" r="10" fill="#F5F5F0" stroke="#A8A29E" stroke-width="1"/><text x="493" y="430" text-anchor="middle" font-size="11" font-weight="700" fill="#44403C">5</text><text x="512" y="430" font-size="13" font-weight="700" fill="#1C1917">Bez oblika na -ing<tspan dx="8" font-weight="400" fill="#57534E">Nema „ensuring“.</tspan></text></g>

<text x="450" y="532" text-anchor="middle" font-size="11" font-style="italic" fill="#78716C"><animate attributeName="opacity" values="0;0;1" dur="3.80s" keyTimes="0;0.895;1" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1"/>Primjer u stilu STE-a, nije provjeren prema standardu.</text>

<g class="replay-btn" style="cursor:pointer; opacity:0; transition: opacity 0.2s ease;" role="button" tabindex="0" aria-label="Pusti animaciju ponovo">
<circle cx="855" cy="40" r="16" fill="#F5F5F0" stroke="#E7E5E4" stroke-width="1"/>
<path d="M 855 31 A 9 9 0 1 1 846 40" fill="none" stroke="#78716C" stroke-width="1.5" stroke-linecap="round"/>
<polygon points="852,28 858,28 855,33" fill="#78716C"/>
<title>Pusti ponovo</title>
</g>
<style>
#ste-svg:hover .replay-btn { opacity: 1 !important; }
#ste-svg .replay-btn:hover circle { fill: #FDF6EC; stroke: #B45309; }
#ste-svg .replay-btn:hover path { stroke: #B45309; }
#ste-svg .replay-btn:hover polygon { fill: #B45309; }
#ste-svg .replay-btn:focus { outline: none; opacity: 1 !important; }
#ste-svg .replay-btn:focus circle { stroke: #B45309; stroke-width: 2; }
@media (prefers-reduced-motion: reduce) {
  #ste-svg animate, #ste-svg animateTransform { display: none; }
  #ste-svg .replay-btn { display: none; }
}
</style>
<script>
// <![CDATA[
(function () {
  const svg = document.getElementById('ste-svg');
  const btn = svg && svg.querySelector('.replay-btn');
  if (!svg || !btn) return;
  // Reduced motion: stop the timeline at its end so the final state shows even if SMIL keeps running.
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches && svg.pauseAnimations) {
    svg.pauseAnimations(); svg.setCurrentTime(10); return;
  }
  function replay() { if (typeof svg.setCurrentTime === 'function') svg.setCurrentTime(0); }
  btn.addEventListener('click', replay);
  btn.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); replay(); }
  });
})();
// ]]>
</script>
</svg>
