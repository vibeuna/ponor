<rect x="60" y="164" width="220" height="60" rx="8" fill="#F5F5F0" stroke="#E7E5E4" stroke-width="1"/>
<rect x="60" y="164" width="3" height="60" fill="#78716C"/>
<text x="78" y="183" font-size="11" font-weight="700" letter-spacing="0.8" fill="#78716C">ZAHTJEV</text>
