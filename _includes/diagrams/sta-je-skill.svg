<text x="60" y="418" font-size="12" fill="#44403C">upute zatraže</text>
<rect x="300" y="372" width="540" height="36" rx="8" fill="#FAF9F6" stroke="#A8A29E" stroke-width="1.5"/><rect x="304" y="376" width="90" height="28" rx="6" fill="#E7E5E4" stroke="#D6D3D1" stroke-width="1"/><text x="349.0" y="394" text-anchor="middle" font-size="11" font-weight="500" fill="#44403C">prompt</text><rect x="398" y="376" width="80" height="28" rx="6" fill="#D6D3D1" stroke="#A8A29E" stroke-width="1"/><text x="438.0" y="394" text-anchor="middle" font-size="11" font-weight="500" fill="#44403C">opisi</text><rect x="482" y="376" width="100" height="28" rx="6" fill="#FDF6EC" stroke="#B45309" stroke-width="1.5"/><text x="532.0" y="394" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">SKILL.md</text>
