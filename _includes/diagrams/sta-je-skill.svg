<g><animate attributeName="opacity" values="0;0;1" dur="0.85s" keyTimes="0;0.588;1" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1"/><rect x="398" y="96" width="80" height="28" rx="6" fill="#D6D3D1" stroke="#A8A29E" stroke-width="1"/><text x="438.0" y="114" text-anchor="middle" font-size="11" font-weight="500" fill="#44403C">opisi</text></g>
<text x="398" y="146" font-size="11" font-style="italic" fill="#78716C"><animate attributeName="opacity" values="0;0;1" dur="1.00s" keyTimes="0;0.650;1" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1"/>oko 100 tokena po vještini</text>

<!-- Request and the matching decision -->
