<rect x="300" y="280" width="540" height="36" rx="8" fill="#FAF9F6" stroke="#A8A29E" stroke-width="1.5"/><rect x="304" y="284" width="90" height="28" rx="6" fill="#E7E5E4" stroke="#D6D3D1" stroke-width="1"/><text x="349.0" y="302" text-anchor="middle" font-size="11" font-weight="500" fill="#44403C">prompt</text><rect x="398" y="284" width="80" height="28" rx="6" fill="#D6D3D1" stroke="#A8A29E" stroke-width="1"/><text x="438.0" y="302" text-anchor="middle" font-size="11" font-weight="500" fill="#44403C">opisi</text>
</g>
<g><animate attributeName="opacity" values="0;0;1" dur="2.65s" keyTimes="0;0.868;1" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1"/><rect x="482" y="284" width="100" height="28" rx="6" fill="#FDF6EC" stroke="#B45309" stroke-width="1.5"/><text x="532.0" y="302" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">SKILL.md</text></g>
<text x="482" y="334" font-size="11" font-style="italic" fill="#78716C"><animate attributeName="opacity" values="0;0;1" dur="2.85s" keyTimes="0;0.877;1" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1"/>preporuka: ispod 5.000 tokena</text>

<!-- Step 3: files on demand -->
<g><animate attributeName="opacity" values="0;0;1" dur="3.05s" keyTimes="0;0.885;1" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1"/>
<text x="60" y="384" font-size="11" font-weight="700" letter-spacing="0.8" fill="#78716C">3 · PO POTREBI</text>
