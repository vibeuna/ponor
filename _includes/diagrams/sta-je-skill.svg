<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Inter, system-ui, -apple-system, sans-serif" id="skill-load-svg" role="img" aria-labelledby="skill-load-svg-title skill-load-svg-desc">
<title id="skill-load-svg-title">Šta ulazi u kontekstni prozor, a šta ostaje vani</title>
<desc id="skill-load-svg-desc">Prozor se puni u tri koraka. Prvi korak, na početku: u kontekstnom prozoru su sistemski prompt te nazivi i opisi svih vještina, oko 100 tokena po vještini. Zatim stiže zahtjev, na primjer: Pripremi izvještaj iz ovih bilješki. Model provjerava odgovara li zahtjev nekom opisu. Ako ne odgovara, ništa se ne učitava i odgovor ide bez vještine. Ako odgovara, drugi korak: u prozor se učitava tijelo fajla SKILL.md, preporuka je ispod 5.000 tokena. Treći korak, po potrebi: fajl iz references, na primjer šablon, čita se u prozor, a skripta iz scripts se pokreće van prozora, pa u prozor ulazi samo njen izlaz, ne i kod. Nazivi i opisi su uvijek u prozoru, ostatak tek kad zatreba.</desc>
<defs>
<marker id="skill-load-svg-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker>
<marker id="skill-load-svg-arrow-stone" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#78716C"/></marker>
</defs>
<rect width="900" height="620" fill="#FAF9F6"/>
<text x="450" y="42" text-anchor="middle" font-family="Merriweather, Georgia, serif" font-size="20" font-weight="700" fill="#1C1917">Šta ulazi u kontekstni prozor, a šta ostaje vani</text>
<text x="450" y="66" text-anchor="middle" font-size="13" fill="#78716C">Prozor se puni korak po korak, a ne unaprijed</text>

<!-- Step 1: startup -->
<g><animate attributeName="opacity" values="0;0;1" dur="0.55s" keyTimes="0;0.364;1" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1"/>
<text x="60" y="104" font-size="11" font-weight="700" letter-spacing="0.8" fill="#78716C">1 · NA POČETKU</text>
<text x="60" y="122" font-size="12" fill="#44403C">Nazivi i opisi svih vještina</text>
