<rect x="520" y="446" width="170" height="52" rx="8" fill="#F5F5F0" stroke="#A8A29E" stroke-width="1.5" stroke-dasharray="5 4"/><text x="532" y="468" font-size="12" font-weight="700" fill="#1C1917">references/sablon.md</text><text x="532" y="486" font-size="11" fill="#57534E">dokument se čita u prozor</text>
<rect x="700" y="446" width="140" height="52" rx="8" fill="#F5F5F0" stroke="#A8A29E" stroke-width="1.5" stroke-dasharray="5 4"/><text x="712" y="468" font-size="12" font-weight="700" fill="#1C1917">scripts/provjeri.py</text><text x="712" y="486" font-size="11" fill="#57534E">kod ostaje vani</text>
</g>
