<text x="698" y="190" font-size="12" fill="#44403C">Ništa se ne učitava.</text>
<text x="698" y="208" font-size="12" fill="#44403C">Odgovor bez vještine.</text>
</g>
<g><animate attributeName="opacity" values="0;0;1" dur="2.20s" keyTimes="0;0.864;1" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1"/>
<line x1="532" y1="236" x2="532" y2="270" stroke="#B45309" stroke-width="2" marker-end="url(#skill-load-svg-arrow)"/>
