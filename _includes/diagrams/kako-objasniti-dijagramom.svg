<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Inter, system-ui, -apple-system, sans-serif" id="vjestina-svg" role="img" aria-labelledby="vjestina-svg-title vjestina-svg-desc">
<title id="vjestina-svg-title">Kako se vještina učitava</title>
<desc id="vjestina-svg-desc">Korisnik pita: Kako radi prenos novca između banaka? Prvi nivo, uvijek u kontekstnom prozoru: četiri instalirane vještine, objasni-dijagramom, sazetak-sastanka, provjera-pravopisa i excel-tabele, svaka samo s nazivom i opisom, oko 100 tokena. Pitanje odgovara opisu vještine objasni-dijagramom. Drugi nivo: tek tada se učitavaju upute iz SKILL.md, preporuka ispod 5.000 tokena. Treći nivo: dodatni fajlovi, skripte i dokumenti, učitavaju se samo kad zatrebaju. Ostale vještine ostaju samo naziv i opis. Odgovor: dijagram toka i dvije do četiri rečenice.</desc>
