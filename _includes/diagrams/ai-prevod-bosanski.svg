<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Inter, system-ui, -apple-system, sans-serif" id="prevod-svg" role="img" aria-labelledby="prevod-svg-title prevod-svg-desc">
<title id="prevod-svg-title">Gdje su alati skliznuli u hrvatski ili srpski</title>
<desc id="prevod-svg-desc">Izbor riječi u Ponorovom testu prevođenja s engleskog na bosanski, 13. 10. 2026. Spoons: DeepL žlice (hrvatski), Google Translate, ChatGPT s kratkim promptom i ChatGPT s uputom kašike. Basket: DeepL i ChatGPT s uputom košaru (hrvatski), Google Translate i ChatGPT s kratkim promptom korpu. History: Google Translate istorije (srpski), ostali historije. Ukupno riječi označenih kao hrvatske ili srpske: DeepL 2, Google Translate 1, ChatGPT s kratkim promptom 0, ChatGPT s uputom 1. Jedan prolaz, jedan urednik, ilustracija, ne poredak alata.</desc>
<rect width="900" height="560" fill="#FAF9F6"/>
<text x="450" y="42" text-anchor="middle" font-family="Merriweather, Georgia, serif" font-size="20" font-weight="700" fill="#1C1917">Ista rečenica, druga riječ</text>
<text x="450" y="66" text-anchor="middle" font-size="13" fill="#78716C">Izbor riječi u našem testu prevođenja na bosanski, 13. 10. 2026.</text>
