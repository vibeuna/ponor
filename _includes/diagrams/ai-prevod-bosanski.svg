<text x="92" y="450" font-family="Merriweather, Georgia, serif" font-size="13" font-weight="700" fill="#1C1917">Značenje očuvano, riječ iz drugog standarda</text>
<text x="92" y="474" font-size="13" fill="#44403C">Urednik je žlice i košaru označio kao hrvatske, a istorije kao srpsku riječ.</text>
<text x="92" y="494" font-size="13" fill="#44403C">Uputa „ne hrvatski“ nije spriječila košaru kod ChatGPT-a.</text>
<text x="92" y="516" font-size="11" font-style="italic" fill="#78716C">Jedan prolaz, jedan urednik, 20 rečenica: ilustracija, ne poredak alata.</text>
