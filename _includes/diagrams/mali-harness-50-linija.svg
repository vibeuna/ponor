<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Inter, system-ui, -apple-system, sans-serif" id="mali-harness-svg" role="img" aria-labelledby="mali-harness-svg-title mali-harness-svg-desc">
<title id="mali-harness-svg-title">Mali harness: gdje je koji dio</title>
<desc id="mali-harness-svg-desc">Zadatak ulazi u skriptu harness.py. Petlja u linijama 39 do 56 sastavi poruke (linije 40 do 43), pošalje ih modelu (linije 28 do 33 i 44) i provjeri traži li model alat (linije 44 do 47). Ako traži, provjera dozvole (linije 35 do 37, samo za save_note) odlučuje smije li se alat izvršiti, alat se izvrši (linije 48 do 55), a rezultat se dodaje u poruke i petlja se ponavlja, najviše 8 puta. Ako model ne traži alat, njegov odgovor je izlaz. Uz petlju skripta sadrži alate (linije 7 do 16), opise alata (linije 18 do 26), fajl s uputama (linija 41) i ograničenje MAX_TURNS (linije 5, 43 i 56). U skripti nema sažimanja, koda oko alata, podagenata, sesija, pravog sandboxa ni ograničenja troška.</desc>
