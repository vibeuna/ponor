<line x1="656" y1="288" x2="676" y2="288" stroke="#B45309" stroke-width="2" marker-end="url(#mali-harness-svg-arrow)"><animate attributeName="opacity" values="0;0;1" dur="2.55s" keyTimes="0;0.902;1" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1"/></line>
<g><animate attributeName="opacity" values="0;0;1" dur="2.80s" keyTimes="0;0.875;1" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1"/><rect x="684" y="248" width="132" height="80" rx="8" fill="#F5F5F0" stroke="#A8A29E" stroke-width="1.5"/><text x="750.0" y="274" text-anchor="middle" font-size="13" font-weight="700" fill="#1C1917">Izvrši alat</text><text x="750.0" y="294" text-anchor="middle" font-size="11" fill="#57534E">funkcija iz TOOLS</text><text x="750.0" y="310" text-anchor="middle" font-size="11" font-weight="600" fill="#78716C">l. 48–55</text></g>

