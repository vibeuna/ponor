<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Inter, system-ui, -apple-system, sans-serif" id="mcp-svg" role="img" aria-labelledby="mcp-title mcp-desc">
  <title id="mcp-title">Kako host razgovara sa serverima preko MCP-a</title>
  <desc id="mcp-desc">Host s modelom drži po jedan klijent za svaki server. Prvi server, Filesystem, radi lokalno i s klijentom razgovara preko stdio. Drugi i treći, GitHub i Supabase, rade udaljeno preko Streamable HTTP. Poziv alata teče u tri koraka: klijent pita server šta nudi, model traži alat a host šalje poziv, server izvrši alat i vrati rezultat.</desc>
  <defs>
    <marker id="mcp-arrow-stone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#78716C"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="#FAF9F6"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" font-family="Merriweather, Georgia, serif" font-size="20" font-weight="700" fill="#1C1917">Kako host razgovara sa serverima preko MCP-a</text>
  <text x="450" y="66" text-anchor="middle" font-size="13" fill="#78716C">Jedan host, po jedan klijent za svaki server, a alate nudi server</text>

  <!-- ============================================================ -->
  <!-- HOST (focal): x=60-460, y=92-418                              -->
  <!-- Rows: y=145, 240, 335 (h=64), centers 177 / 272 / 367         -->
  <!-- ============================================================ -->
  <g class="rv" opacity="0">
    <animate attributeName="opacity" from="0" to="1" values="0;1" keyTimes="0;1" begin="0.2s" dur="0.4s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <rect x="60" y="92" width="400" height="326" rx="8" fill="#FDF6EC" stroke="#B45309" stroke-width="1.5"/>
    <rect x="60" y="92" width="3" height="326" fill="#B45309"/>
    <text x="80" y="116" font-size="11" font-weight="700" fill="#B45309" letter-spacing="0.8">HOST</text>
    <text x="122" y="116" font-size="11" fill="#78716C">aplikacija s modelom (npr. Claude Code, VS Code)</text>
  </g>

  <!-- Server column header -->
  <g class="rv" opacity="0">
    <animate attributeName="opacity" from="0" to="1" values="0;1" keyTimes="0;1" begin="0.5s" dur="0.4s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <text x="640" y="116" font-size="11" font-weight="700" fill="#78716C" letter-spacing="0.8">SERVERI</text>
  </g>

  <!-- Model -->
  <g class="rv" opacity="0">
    <animate attributeName="opacity" from="0" to="1" values="0;1" keyTimes="0;1" begin="0.6s" dur="0.4s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <rect x="80" y="210" width="120" height="124" rx="8" fill="#F5F5F0" stroke="#E7E5E4" stroke-width="1.5"/>
    <text x="140" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#1C1917">MODEL</text>
    <text x="140" y="286" text-anchor="middle" font-size="11" fill="#57534E">traži alate</text>
  </g>

  <!-- Bus: model -> three clients (host creates one client per server) -->
  <g class="rv" opacity="0">
    <animate attributeName="opacity" from="0" to="1" values="0;1" keyTimes="0;1" begin="1.0s" dur="0.3s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <path d="M 208 272 H 226" fill="none" stroke="#78716C" stroke-width="1.5"/>
    <path d="M 226 177 V 367" fill="none" stroke="#78716C" stroke-width="1.5"/>
    <line x1="226" y1="177" x2="242" y2="177" stroke="#78716C" stroke-width="1.5" marker-end="url(#mcp-arrow-stone)"/>
    <line x1="226" y1="272" x2="242" y2="272" stroke="#78716C" stroke-width="1.5" marker-end="url(#mcp-arrow-stone)"/>
    <line x1="226" y1="367" x2="242" y2="367" stroke="#78716C" stroke-width="1.5" marker-end="url(#mcp-arrow-stone)"/>
  </g>

  <!-- ===================== ROW 1: Filesystem (local) ===================== -->
  <g class="rv" opacity="0">
    <animate attributeName="opacity" from="0" to="1" values="0;1" keyTimes="0;1" begin="1.2s" dur="0.4s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <rect x="250" y="145" width="190" height="64" rx="8" fill="#F5F5F0" stroke="#E7E5E4" stroke-width="1.5"/>
    <text x="268" y="168" font-size="11" font-weight="700" fill="#78716C" letter-spacing="0.8">KLIJENT 1</text>
    <text x="268" y="190" font-size="12" fill="#57534E">drži vezu s jednim serverom</text>
  </g>
  <g class="rv" opacity="0">
    <animate attributeName="opacity" from="0" to="1" values="0;1" keyTimes="0;1" begin="1.5s" dur="0.3s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <line x1="448" y1="177" x2="632" y2="177" stroke="#78716C" stroke-width="1.5" marker-start="url(#mcp-arrow-stone)" marker-end="url(#mcp-arrow-stone)"/>
    <text x="540" y="167" text-anchor="middle" font-size="11" font-weight="700" fill="#44403C">stdio</text>
    <text x="540" y="195" text-anchor="middle" font-size="11" font-style="italic" fill="#78716C">lokalni server</text>
  </g>
  <g class="rv" opacity="0">
    <animate attributeName="opacity" from="0" to="1" values="0;1" keyTimes="0;1" begin="1.7s" dur="0.4s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <rect x="640" y="145" width="200" height="64" rx="8" fill="#F5F5F0" stroke="#E7E5E4" stroke-width="1.5"/>
    <text x="658" y="173" font-size="14" font-weight="700" fill="#1C1917">Filesystem</text>
    <text x="658" y="193" font-size="12" fill="#57534E">fajlovi na vašem računaru</text>
  </g>

  <!-- ===================== ROW 2: GitHub (remote) ===================== -->
  <g class="rv" opacity="0">
    <animate attributeName="opacity" from="0" to="1" values="0;1" keyTimes="0;1" begin="1.5s" dur="0.4s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <rect x="250" y="240" width="190" height="64" rx="8" fill="#F5F5F0" stroke="#E7E5E4" stroke-width="1.5"/>
    <text x="268" y="263" font-size="11" font-weight="700" fill="#78716C" letter-spacing="0.8">KLIJENT 2</text>
    <text x="268" y="285" font-size="12" fill="#57534E">drži vezu s jednim serverom</text>
  </g>
  <g class="rv" opacity="0">
    <animate attributeName="opacity" from="0" to="1" values="0;1" keyTimes="0;1" begin="1.8s" dur="0.3s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <line x1="448" y1="272" x2="632" y2="272" stroke="#78716C" stroke-width="1.5" marker-start="url(#mcp-arrow-stone)" marker-end="url(#mcp-arrow-stone)"/>
    <text x="540" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="#44403C">Streamable HTTP</text>
    <text x="540" y="290" text-anchor="middle" font-size="11" font-style="italic" fill="#78716C">udaljeni server</text>
  </g>
  <g class="rv" opacity="0">
    <animate attributeName="opacity" from="0" to="1" values="0;1" keyTimes="0;1" begin="2.0s" dur="0.4s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <rect x="640" y="240" width="200" height="64" rx="8" fill="#F5F5F0" stroke="#E7E5E4" stroke-width="1.5"/>
    <text x="658" y="268" font-size="14" font-weight="700" fill="#1C1917">GitHub</text>
    <text x="658" y="288" font-size="12" fill="#57534E">repozitoriji, issues, pull requesti</text>
  </g>

  <!-- ===================== ROW 3: Supabase (remote) ===================== -->
  <g class="rv" opacity="0">
    <animate attributeName="opacity" from="0" to="1" values="0;1" keyTimes="0;1" begin="1.8s" dur="0.4s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <rect x="250" y="335" width="190" height="64" rx="8" fill="#F5F5F0" stroke="#E7E5E4" stroke-width="1.5"/>
    <text x="268" y="358" font-size="11" font-weight="700" fill="#78716C" letter-spacing="0.8">KLIJENT 3</text>
    <text x="268" y="380" font-size="12" fill="#57534E">drži vezu s jednim serverom</text>
  </g>
  <g class="rv" opacity="0">
    <animate attributeName="opacity" from="0" to="1" values="0;1" keyTimes="0;1" begin="2.1s" dur="0.3s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <line x1="448" y1="367" x2="632" y2="367" stroke="#78716C" stroke-width="1.5" marker-start="url(#mcp-arrow-stone)" marker-end="url(#mcp-arrow-stone)"/>
    <text x="540" y="357" text-anchor="middle" font-size="11" font-weight="700" fill="#44403C">Streamable HTTP</text>
    <text x="540" y="385" text-anchor="middle" font-size="11" font-style="italic" fill="#78716C">udaljeni server</text>
  </g>
  <g class="rv" opacity="0">
    <animate attributeName="opacity" from="0" to="1" values="0;1" keyTimes="0;1" begin="2.3s" dur="0.4s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <rect x="640" y="335" width="200" height="64" rx="8" fill="#F5F5F0" stroke="#E7E5E4" stroke-width="1.5"/>
    <text x="658" y="363" font-size="14" font-weight="700" fill="#1C1917">Supabase</text>
    <text x="658" y="383" font-size="12" fill="#57534E">baza podataka (npr. SQL upiti)</text>
  </g>

  <!-- ============================================================ -->
  <!-- OUTPUT-style callout: how a tool call flows (y=446-550)       -->
  <!-- ============================================================ -->
  <g class="rv rv-rise" opacity="0" transform="translate(0,8)">
    <animate attributeName="opacity" from="0" to="1" values="0;1" keyTimes="0;1" begin="3.0s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" values="0 8;0 0" keyTimes="0;1" begin="3.0s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <rect x="60" y="446" width="780" height="104" rx="8" fill="#FDF6EC" stroke="#B45309" stroke-width="1"/>
    <rect x="60" y="446" width="3" height="104" fill="#B45309"/>
    <text x="80" y="470" font-size="11" font-weight="700" fill="#B45309" letter-spacing="0.8">KAKO TEČE POZIV ALATA</text>
    <text x="80" y="494" font-size="13" fill="#1C1917"><tspan font-weight="700" fill="#92400E">1.</tspan> Klijent pita server šta nudi, a server vrati popis alata s opisima.</text>
    <text x="80" y="516" font-size="13" fill="#1C1917"><tspan font-weight="700" fill="#92400E">2.</tspan> Model na osnovu opisa traži alat, a host obično uz odobrenje korisnika šalje poziv serveru.</text>
    <text x="80" y="538" font-size="13" fill="#1C1917"><tspan font-weight="700" fill="#92400E">3.</tspan> Server izvrši alat i vrati rezultat, koji model koristi u odgovoru.</text>
  </g>

  <!-- Footnote -->
  <g class="rv" opacity="0">
    <animate attributeName="opacity" from="0" to="1" values="0;1" keyTimes="0;1" begin="3.9s" dur="0.4s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <text x="60" y="580" font-size="11" fill="#78716C" font-style="italic">Pojednostavljeno: host može imati više klijenata i servera. Servere navodimo kao primjere.</text>
  </g>

  <!-- ============ REPLAY BUTTON ============ -->
  <g class="replay-btn" style="cursor:pointer; opacity:0; transition: opacity 0.2s ease;" role="button" tabindex="0" aria-label="Pusti animaciju ponovo">
    <circle cx="855" cy="40" r="16" fill="#F5F5F0" stroke="#E7E5E4" stroke-width="1"/>
    <path d="M 855 31 A 9 9 0 1 1 846 40" fill="none" stroke="#78716C" stroke-width="1.5" stroke-linecap="round"/>
    <polygon points="852,28 858,28 855,33" fill="#78716C"/>
    <title>Pusti ponovo</title>
  </g>

  <style>
    #mcp-svg:hover .replay-btn { opacity: 1 !important; }
    #mcp-svg .replay-btn:hover circle { fill: #FDF6EC; stroke: #B45309; }
    #mcp-svg .replay-btn:hover path { stroke: #B45309; }
    #mcp-svg .replay-btn:hover polygon { fill: #B45309; }
    #mcp-svg .replay-btn:focus { outline: none; opacity: 1 !important; }
    #mcp-svg .replay-btn:focus circle { stroke: #B45309; stroke-width: 2; }
    @media (prefers-reduced-motion: reduce) {
      #mcp-svg animate, #mcp-svg animateTransform { display: none; }
      #mcp-svg .replay-btn { display: none; }
      /* display:none does not reliably stop SMIL, and the groups start at
         opacity 0; force the final state so nothing stays invisible. */
      #mcp-svg .rv { opacity: 1 !important; }
      #mcp-svg .rv-rise { transform: none !important; }
    }
  </style>

  <script>
    // <![CDATA[
    (function () {
      const svg = document.getElementById('mcp-svg');
      const btn = svg && svg.querySelector('.replay-btn');
      if (!svg || !btn) return;
      function replay() { if (typeof svg.setCurrentTime === 'function') svg.setCurrentTime(0); }
      btn.addEventListener('click', replay);
      btn.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); replay(); }
      });
    })();
    // ]]>
  </script>
</svg>
