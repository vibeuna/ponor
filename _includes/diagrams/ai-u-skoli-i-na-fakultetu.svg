<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Inter, system-ui, -apple-system, sans-serif" id="ai-skola-svg" role="img" aria-labelledby="ai-skola-svg-title ai-skola-svg-desc">
<title id="ai-skola-svg-title">Od pomoći do prepisivanja: pet koraka</title>
<desc id="ai-skola-svg-desc">Pet načina upotrebe umjetne inteligencije u studentskom radu, poredanih od pomoći do prepisivanja, prema primjerima iz politike Univerziteta u Sarajevu. Korak 1, učenje: objašnjenje zadatka, zadaci za vježbu, kartice i sažeci; ništa se ne predaje, pa nema ni izjave. Korak 2, jezička dorada vlastitog teksta: gramatika, pravopis, jasnije rečenice, komentar na nacrt; izjava prema pravilima. Korak 3, ideje, literatura i struktura: smišljanje ideja, ključne riječi, plan rada; izjava prema pravilima. Korak 4, AI proizvodi dio rada: prevod vlastitog teksta, početni kod, analiza podataka; izjava je obavezna. Korak 5, prepisivanje: rad koji je generisao AI predan kao vlastiti ili prikrivena upotreba; to je kršenje akademskog integriteta prema članu 12. Na svakom koraku odlučuju tri pitanja: ko je obavio misaoni posao, da li je upotreba prijavljena i šta dozvoljava pravilo predmeta. Prepisivanje počinje kad je odgovor pogrešan na bar jedno od njih.</desc>
<defs>
<marker id="ai-skola-svg-arrow-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#78716C"/></marker>
<marker id="ai-skola-svg-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker>
</defs>
