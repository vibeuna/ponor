<text x="450" y="586" text-anchor="middle" font-size="11" font-style="italic" fill="#78716C"><animate attributeName="opacity" values="0;0;1" dur="3.75s" keyTimes="0;0.907;1" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1"/>Primjeri iz politike Univerziteta u Sarajevu (26. 5. 2026.). Druge ustanove i predmeti mogu to urediti drugačije.</text>

