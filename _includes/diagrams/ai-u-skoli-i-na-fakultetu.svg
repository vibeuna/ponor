<g><animate attributeName="opacity" values="0;0;1" dur="1.75s" keyTimes="0;0.800;1" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1"/><rect x="537" y="136" width="144" height="178" rx="8" fill="#F5F5F0" stroke="#A8A29E" stroke-width="1.5"/><text x="551" y="158" font-size="11" font-weight="700" letter-spacing="0.8" fill="#78716C">KORAK 4</text><text x="551" y="180" font-family="Merriweather, Georgia, serif" font-size="13" font-weight="700" fill="#1C1917">AI proizvodi</text><text x="551" y="197" font-family="Merriweather, Georgia, serif" font-size="13" font-weight="700" fill="#1C1917">dio rada</text><text x="551" y="228" font-size="11" fill="#44403C">Prevod vlastitog teksta</text><text x="551" y="244" font-size="11" fill="#44403C">Početni kod</text><text x="551" y="260" font-size="11" fill="#44403C">Analiza podataka</text><line x1="551" y1="272" x2="667" y2="272" stroke="#E7E5E4" stroke-width="1"/><text x="551" y="289" font-size="9.5" font-weight="700" letter-spacing="0.8" fill="#78716C">IZJAVA</text><text x="551" y="305" font-size="11.5" font-weight="700" fill="#92400E">Obavezna</text></g>
