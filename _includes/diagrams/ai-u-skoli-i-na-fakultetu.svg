<text x="80" y="518" font-family="Merriweather, Georgia, serif" font-size="15" font-style="italic" fill="#1C1917">kad je odgovor pogrešan na bar jedno od tri pitanja.</text>
<text x="80" y="541" font-size="12" fill="#44403C">Isti alat može biti pomoć ili prepisivanje: razliku pravi ko je radio, šta je prijavljeno i šta predmet dozvoljava.</text>
