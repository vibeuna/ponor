<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Inter, system-ui, -apple-system, sans-serif" id="ollama-svg" role="img" aria-labelledby="ollama-svg-title ollama-svg-desc">
<title id="ollama-svg-title">Od instalacije do prvog razgovora s Ollamom</title>
<desc id="ollama-svg-desc">Tri koraka na Ubuntuu, sva na vašem računaru. Korak 1, instalacija: curl -fsSL https://ollama.com/install.sh | sh; skripta postavlja servis na localhost:11434. Korak 2, preuzimanje modela: ollama pull gemma4:e2b; težine modela (4,6 GB) stižu na disk. Korak 3, razgovor: ollama run gemma4:e2b; chatbot u terminalu, /bye zatvara razgovor. Ispod: lokalni model drži težine na vašem disku i odgovara na vašem računaru, i bez grafičke kartice; model u oblaku (oznake sa cloud) šalje prompt na Ollamine servere i isključuje se postavkom OLLAMA_NO_CLOUD=1.</desc>
<defs>
<marker id="ollama-svg-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker>
</defs>
<rect width="900" height="560" fill="#FAF9F6"/>
<text x="450" y="42" text-anchor="middle" font-family="Merriweather, Georgia, serif" font-size="20" font-weight="700" fill="#1C1917">Od instalacije do prvog razgovora</text>
<text x="450" y="66" text-anchor="middle" font-size="13" fill="#78716C">Tri komande na Ubuntuu, sve radi na vašem računaru</text>

<g><animate attributeName="opacity" values="0;0;1" dur="0.60s" keyTimes="0;0.333;1" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1"/>
<rect x="40" y="88" width="820" height="218" rx="8" fill="none" stroke="#A8A29E" stroke-width="1" stroke-dasharray="4 4"/>
<text x="56" y="108" font-size="10" font-weight="700" letter-spacing="0.8" fill="#78716C">VAŠ RAČUNAR · UBUNTU</text>
</g>
<g><animate attributeName="opacity" values="0;0;1" dur="0.80s" keyTimes="0;0.500;1" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1"/><rect x="60" y="120" width="220" height="170" rx="8" fill="#F5F5F0" stroke="#E7E5E4" stroke-width="1.5"/><rect x="60" y="120" width="3" height="170" fill="#78716C"/><text x="84" y="146" font-size="11" font-weight="700" letter-spacing="0.8" fill="#78716C">KORAK 1</text><text x="84" y="170" font-family="Merriweather, Georgia, serif" font-size="15" font-weight="700" fill="#1C1917">Instalacija</text><rect x="72" y="184" width="196" height="44" rx="6" fill="#FAF9F6" stroke="#E7E5E4" stroke-width="1"/><text x="170" y="202" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1C1917">curl -fsSL https://ollama.com</text><text x="170" y="218" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1C1917">/install.sh | sh</text><text x="84" y="254" font-size="13" fill="#44403C">Skripta postavlja servis</text><text x="84" y="272" font-size="13" fill="#44403C">na localhost:11434.</text></g>
<g><animate attributeName="opacity" values="0;0;1" dur="1.70s" keyTimes="0;0.765;1" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1"/><rect x="340" y="120" width="220" height="170" rx="8" fill="#F5F5F0" stroke="#E7E5E4" stroke-width="1.5"/><rect x="340" y="120" width="3" height="170" fill="#78716C"/><text x="364" y="146" font-size="11" font-weight="700" letter-spacing="0.8" fill="#78716C">KORAK 2</text><text x="364" y="170" font-family="Merriweather, Georgia, serif" font-size="15" font-weight="700" fill="#1C1917">Preuzimanje modela</text><rect x="352" y="184" width="196" height="44" rx="6" fill="#FAF9F6" stroke="#E7E5E4" stroke-width="1"/><text x="450" y="210" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1C1917">ollama pull gemma4:e2b</text><text x="364" y="254" font-size="13" fill="#44403C">Težine modela (4,6 GB)</text><text x="364" y="272" font-size="13" fill="#44403C">stižu na vaš disk.</text></g>
<g><animate attributeName="opacity" values="0;0;1" dur="2.60s" keyTimes="0;0.846;1" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" dur="2.70s" keyTimes="0;0.815;1" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1"/><rect x="620" y="120" width="220" height="170" rx="8" fill="#FDF6EC" stroke="#B45309" stroke-width="2"/><rect x="620" y="120" width="3" height="170" fill="#B45309"/><text x="644" y="146" font-size="11" font-weight="700" letter-spacing="0.8" fill="#B45309">KORAK 3</text><text x="644" y="170" font-family="Merriweather, Georgia, serif" font-size="15" font-weight="700" fill="#1C1917">Razgovor</text><rect x="632" y="184" width="196" height="44" rx="6" fill="#FAF9F6" stroke="#E7E5E4" stroke-width="1"/><text x="730" y="210" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1C1917">ollama run gemma4:e2b</text><text x="644" y="254" font-size="13" fill="#44403C">Chatbot u terminalu.</text><text x="644" y="272" font-size="13" fill="#44403C">/bye zatvara razgovor.</text></g>
<line x1="290" y1="205" x2="330" y2="205" stroke="#B45309" stroke-width="2" marker-end="url(#ollama-svg-arrow)"><animate attributeName="opacity" values="0;0;1" dur="1.30s" keyTimes="0;0.769;1" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1"/></line>
<line x1="570" y1="205" x2="610" y2="205" stroke="#B45309" stroke-width="2" marker-end="url(#ollama-svg-arrow)"><animate attributeName="opacity" values="0;0;1" dur="2.20s" keyTimes="0;0.864;1" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1"/></line>

<g><animate attributeName="opacity" values="0;0;1" dur="3.30s" keyTimes="0;0.879;1" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" dur="3.40s" keyTimes="0;0.853;1" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1"/>
<rect x="60" y="330" width="780" height="154" rx="8" fill="#F5F5F0" stroke="#E7E5E4" stroke-width="1.5"/>
<rect x="84" y="350" width="3" height="14" fill="#B45309"/>
<text x="96" y="362" font-family="Merriweather, Georgia, serif" font-size="13" font-weight="700" fill="#1C1917">Lokalni model ili model u oblaku</text>
<line x1="450" y1="378" x2="450" y2="470" stroke="#E7E5E4" stroke-width="1"/>
<text x="84" y="390" font-size="11" font-weight="700" letter-spacing="0.8" fill="#78716C">LOKALNI MODEL</text><text x="84" y="412" font-size="13" fill="#44403C">Težine su na vašem disku.</text><text x="84" y="432" font-size="13" fill="#44403C">Odgovor nastaje na vašem računaru.</text><text x="84" y="452" font-size="13" fill="#44403C">Radi i bez grafičke kartice.</text>
<text x="474" y="390" font-size="11" font-weight="700" letter-spacing="0.8" fill="#78716C">MODEL U OBLAKU</text><text x="474" y="412" font-size="13" fill="#44403C">Oznake sa cloud, npr. gemma4:cloud.</text><text x="474" y="432" font-size="13" fill="#44403C">Prompt ide na Ollamine servere.</text><text x="474" y="452" font-size="13" fill="#44403C">Isključuje se: OLLAMA_NO_CLOUD=1</text>
</g>

<text x="450" y="522" text-anchor="middle" font-size="11" font-style="italic" fill="#78716C"><animate attributeName="opacity" values="0;0;1" dur="3.80s" keyTimes="0;0.895;1" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1"/>Primjer s modelom gemma4:e2b; komande prema dokumentaciji za Ollamu v0.40.5 (oktobar 2026).</text>

<g class="replay-btn" style="cursor:pointer; opacity:0; transition: opacity 0.2s ease;" role="button" tabindex="0" aria-label="Pusti animaciju ponovo">
<circle cx="855" cy="40" r="16" fill="#F5F5F0" stroke="#E7E5E4" stroke-width="1"/>
<path d="M 855 31 A 9 9 0 1 1 846 40" fill="none" stroke="#78716C" stroke-width="1.5" stroke-linecap="round"/>
<polygon points="852,28 858,28 855,33" fill="#78716C"/>
<title>Pusti ponovo</title>
</g>
<style>
#ollama-svg:hover .replay-btn { opacity: 1 !important; }
#ollama-svg .replay-btn:hover circle { fill: #FDF6EC; stroke: #B45309; }
#ollama-svg .replay-btn:hover path { stroke: #B45309; }
#ollama-svg .replay-btn:hover polygon { fill: #B45309; }
#ollama-svg .replay-btn:focus { outline: none; opacity: 1 !important; }
#ollama-svg .replay-btn:focus circle { stroke: #B45309; stroke-width: 2; }
@media (prefers-reduced-motion: reduce) {
  #ollama-svg animate, #ollama-svg animateTransform { display: none; }
  #ollama-svg .replay-btn { display: none; }
}
</style>
<script>
// <![CDATA[
(function () {
  const svg = document.getElementById('ollama-svg');
  const btn = svg && svg.querySelector('.replay-btn');
  if (!svg || !btn) return;
  // Reduced motion: stop the timeline at its end so the final state shows even if SMIL keeps running.
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches && svg.pauseAnimations) {
    svg.pauseAnimations(); svg.setCurrentTime(10); return;
  }
  function replay() { if (typeof svg.setCurrentTime === 'function') svg.setCurrentTime(0); }
  btn.addEventListener('click', replay);
  btn.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); replay(); }
  });
})();
// ]]>
</script>
</svg>
