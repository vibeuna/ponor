<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Inter, system-ui, -apple-system, sans-serif" id="llmw-svg" role="img" aria-labelledby="llmw-title llmw-desc">
<title id="llmw-title">LLM Wiki: tri sloja, tri operacije</title>
<desc id="llmw-desc">Izvori, koje agent samo čita, i pravilnik (CLAUDE.md ili AGENTS.md), koji agent slijedi, ulaze u agenta. Agent radi tri operacije: unos (novi izvor ažurira 10–15 wiki stranica), upit (odgovor iz wikija; dobri odgovori postaju nove stranice) i provjeru (kontradikcije, zastarjele tvrdnje, stranice bez poveznica). Agent piše i održava wiki: Markdown stranice s indeksom (index.md) i dnevnikom (log.md). Za upit agent čita wiki, počevši od indeksa.</desc>
<defs>
