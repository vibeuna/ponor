<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Inter, system-ui, -apple-system, sans-serif" id="aia-svg" role="img" aria-labelledby="aia-svg-title aia-svg-desc">
<title id="aia-svg-title">AI Act: šta važi od kada</title>
<desc id="aia-svg-desc">Vremenska linija primjene Akta o umjetnoj inteligenciji nakon Uredbe (EU) 2026/1744. Ostali ključni datumi: 1. 8. 2024. stupanje na snagu; 2. 2. 2025. zabranjene prakse i AI pismenost; 2. 8. 2025. AI modeli opšte namjene; 2. 8. 2026. opšta primjena i obaveze transparentnosti; 2. 12. 2026. nove zabranjene prakse, dodane 2026.; 2. 8. 2030. rok za usklađivanje visokorizičnih sistema organa javne vlasti koji su već na tržištu. Odgođena pravila za visokorizične AI sisteme: Prilog III s 2. 8. 2026. na 2. 12. 2027., Prilog I s 2. 8. 2027. na 2. 8. 2028. Pravila su odgođena, ne ukinuta. Stanje na dan 13. 10. 2026.</desc>
