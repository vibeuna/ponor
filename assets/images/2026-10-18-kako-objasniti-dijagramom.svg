<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <!-- Background -->
  <rect width="1000" height="600" rx="40" fill="#c8996a"/>

  <!-- Icon: network of a central hub node linked to four satellite nodes: a diagram as boxes joined by links -->
  <g stroke="#1a1a1a" stroke-linecap="round" stroke-linejoin="round">
    <!-- Links (drawn first so nodes sit on top) -->
    <path d="M 500 300 L 330 180 M 500 300 L 670 180 M 500 300 L 330 420 M 500 300 L 670 420 M 330 180 L 330 420" fill="none" stroke-width="16"/>
    <!-- Hub node -->
    <circle cx="500" cy="300" r="64" fill="#d6dff0" stroke-width="18"/>
    <!-- Satellite nodes -->
    <circle cx="330" cy="180" r="42" fill="#fafaf8" stroke-width="16"/>
    <circle cx="670" cy="180" r="42" fill="#fafaf8" stroke-width="16"/>
    <circle cx="330" cy="420" r="42" fill="#fafaf8" stroke-width="16"/>
    <circle cx="670" cy="420" r="42" fill="#fafaf8" stroke-width="16"/>
    <!-- Accent dot in the hub -->
    <circle cx="500" cy="300" r="18" fill="#c8996a" stroke-width="8"/>
  </g>
</svg>
