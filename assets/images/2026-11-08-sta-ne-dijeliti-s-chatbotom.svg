<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <!-- Background -->
  <rect width="1000" height="600" rx="40" fill="#c46e6e"/>

  <!-- Icon: a closed padlock (personal data kept out of the chatbot) -->
  <g stroke="#1a1a1a" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Shackle -->
    <path d="M 410 290 L 410 225 A 90 90 0 0 1 590 225 L 590 290" stroke-width="20"/>
    <!-- Lock body -->
    <rect x="340" y="280" width="320" height="190" rx="30" fill="#fafaf8" stroke-width="18"/>
    <!-- Tinted band across the body -->
    <path d="M 349 330 L 651 330 L 651 442 Q 651 461 632 461 L 368 461 Q 349 461 349 442 Z" fill="#d6dff0" stroke="none"/>
    <path d="M 349 330 L 651 330" stroke-width="10"/>
    <rect x="340" y="280" width="320" height="190" rx="30" stroke-width="18"/>
    <!-- Keyhole -->
    <circle cx="500" cy="387" r="20" fill="#1a1a1a" stroke-width="6"/>
    <path d="M 500 400 L 500 430" stroke-width="16"/>
  </g>
</svg>
