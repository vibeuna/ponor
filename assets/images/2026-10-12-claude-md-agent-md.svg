<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <!-- Background -->
  <rect width="1000" height="600" rx="40" fill="#3c7c8a"/>

  <!-- Icon: clipboard with a checklist: two rules ticked, one still open (standing project rules the agent reads before work) -->
  <g stroke="#1a1a1a" stroke-linecap="round" stroke-linejoin="round">
    <!-- Board -->
    <rect x="375" y="165" width="250" height="295" rx="18" fill="#fafaf8" stroke-width="18"/>
    <!-- Clip -->
    <path d="M 445 188 L 445 160 Q 445 145 460 145 L 475 145 Q 480 125 500 125 Q 520 125 525 145 L 540 145 Q 555 145 555 160 L 555 188 Z"
          fill="#d6dff0" stroke-width="14"/>
    <!-- Row 1: ticked -->
    <rect x="410" y="225" width="44" height="44" rx="8" fill="#d6dff0" stroke-width="9"/>
    <path d="M 420 247 L 430 258 L 446 234" fill="none" stroke-width="9"/>
    <path d="M 480 247 L 590 247" fill="none" stroke-width="9"/>
    <!-- Row 2: ticked -->
    <rect x="410" y="295" width="44" height="44" rx="8" fill="#d6dff0" stroke-width="9"/>
    <path d="M 420 317 L 430 328 L 446 304" fill="none" stroke-width="9"/>
    <path d="M 480 317 L 572 317" fill="none" stroke-width="9"/>
    <!-- Row 3: open -->
    <rect x="410" y="365" width="44" height="44" rx="8" fill="#fafaf8" stroke-width="9"/>
    <path d="M 480 387 L 584 387" fill="none" stroke-width="9"/>
  </g>
</svg>
