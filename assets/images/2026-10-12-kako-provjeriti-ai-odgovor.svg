<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <!-- Background -->
  <rect width="1000" height="600" rx="40" fill="#6b9080"/>

  <!-- Icon: clipboard checklist, two items ticked and one still open: checking a chatbot answer habit by habit -->
  <g stroke="#1a1a1a" stroke-linecap="round" stroke-linejoin="round">
    <!-- Board -->
    <rect x="375" y="155" width="250" height="310" rx="24" fill="#fafaf8" stroke-width="18"/>
    <!-- Clip -->
    <rect x="440" y="133" width="120" height="46" rx="14" fill="#d6dff0" stroke-width="14"/>
    <!-- Checkboxes -->
    <rect x="410" y="213" width="44" height="44" rx="8" fill="#d6dff0" stroke-width="10"/>
    <rect x="410" y="293" width="44" height="44" rx="8" fill="#d6dff0" stroke-width="10"/>
    <rect x="410" y="373" width="44" height="44" rx="8" fill="#fafaf8" stroke-width="10"/>
    <!-- Ticks on the first two -->
    <path d="M 419 235 L 430 247 L 450 220" fill="none" stroke-width="10"/>
    <path d="M 419 315 L 430 327 L 450 300" fill="none" stroke-width="10"/>
    <!-- Item lines -->
    <path d="M 482 235 L 588 235" fill="none" stroke-width="14"/>
    <path d="M 482 315 L 588 315" fill="none" stroke-width="14"/>
    <path d="M 482 395 L 560 395" fill="none" stroke-width="14"/>
  </g>
</svg>
